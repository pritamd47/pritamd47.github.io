- title: Education
  type: time_table
  contents:
    - title: Ph.D. Candidate
      institution: University of Washington, Seattle WA, USA
      year: 2025
      description:
        - Civil and Environmental Engineering
        - "Dissertation: <em>Regulated Surface Water: How Much and Where is it Flowing</em>"
        - title: "Research"
          contents:
            - Bulding on the RAT framework, I developed the ResORR (Reservoir Operations-driven River Regulation) framework to model the regulation of streamflow by dams and reservoirs. <a href="/publications/#dasResORRGloballyScalable2024">Related paper</a>.
            - I also developed a forecasting module for RAT to predict the future state (inflow, storage, and outflow) of reservoirs, based on weather forecasts and operating scenarios. <a href="/publications/#dasForecastInformedReservoirOperations2025">Related paper</a>.
            - I investigated the integration of SWOT with existing satellites to improve the accuracy of surface water storage estimation of reservoirs. <a href="/publications/#dasMultisatelliteTrackingSurface2025">Related paper</a>.
    - title: M.S.
      institution: University of Washington, Seattle WA, USA
      year: 2022
      description:
        - Civil and Environmental Engineering
        - "Thesis: <em>Reservoir Assessment Tool 2.0: Stakeholder driven Improvements to Satellite Remote Sensing based Reservoir Monitoring</em>"
        - title: "Research"
          contents:
            - I developed the version 2 of Reservoir Assessment Tool (RAT), significantly improving the accuracy and frequency of storage change estimates of reservoirs, and the accuracy of modeled inflow based on stakeholder feedback. <a href="/publications/#dasReservoirAssessmentTool2022">Related paper</a>.
            - I also maintained an operational decision support system for the Mekong region, <a href="https://depts.washington.edu/saswe/mekong/">RAT-Mekong</a>. Read more about <a href="../projects/rat-mekong">RAT-Mekong @ projects</a>.
    - title: M.Tech.
      institution: Indian Institute of Technology (IIT) Roorkee, India
      year: 2020
      description:
        - Department of Earth Sciences
        - "Thesis: <em>Snow-cover Variability and Trend Analysis of the Indus Basin and Snow-melt Runoff Modeling of the Beas Basin</em>"

